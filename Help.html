
<html>
<head>
<title>Help - Online Fashion Store Management System</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
*{
box-sizing:border-box;
}
body{
margin:0;
background-color:#e3d6f3;
font-family:Poppins,sans-serif;
}
.nav{
display:flex;
align-items:center;
gap:40px;
background-color:white;
min-height:60px;
width:100%;
padding:0 25px;
}
.logo img{
height:65px;
width:65px;
object-fit:cover;
border-radius:50%;
}
.headline{
color:#A64D79;
font-size:25px;
font-weight:bold;
font-family:Poppins;
}
.headline p{
margin:0;
}
.nav a:first-of-type{
margin-left:auto;
}
.nav a{
color:#872aa6;
text-decoration:none;
font-size:20px;
font-family:Poppins;
}
.nav a:hover{
color:#E8A0A8;
}
.help{
width:90%;
max-width:1000px;
margin:35px auto;
background:white;
padding:30px;
border-radius:18px;
box-shadow:0 5px 18px rgba(93,45,120,0.2);
text-align:center;
}
.help h1{
color:#872aa6;
font-size:35px;
margin:5px 0 8px;
font-family: Poppins;
}
.decor{
color:#A64D79;
font-size:22px;
letter-spacing:5px;
margin-bottom:20px;
}
.help p{
color:#555;
font-size:16px;
}
.problem{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-top:30px;
}
.problem button{
background:#f5eafa;
border:2px solid transparent;
border-radius:15px;
padding:25px 15px;
color:#872aa6;
font-family:Poppins;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}
.problem button:hover{
border-color:#A64D79;
background:white;
transform:translateY(-5px);
}
.options{
display:none;
margin-top:30px;
background:#f5eafa;
padding:25px;
border-radius:15px;
}
.options h2{
color:#872aa6;
font-size:23px;
}
.option-list{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:12px;
margin-top:20px;
}
.option-list button{
background:white;
color:#872aa6;
border:1px solid #d2b8df;
padding:10px 18px;
border-radius:20px;
font-family:Poppins;
cursor:pointer;
}
.option-list button:hover{
background:#872aa6;
color:white;
}
.answer{
display:none;
margin-top:25px;
background:white;
border:2px solid #A64D79;
padding:20px;
border-radius:15px;
}
.answer h2{
color:#872aa6;
margin-top:0;
}
.answer p{
color:#555;
line-height:1.7;
}
.back{
display:inline-block;
margin-top:25px;
background:linear-gradient(135deg,#872aa6,#A64D79);
color:white;
text-decoration:none;
padding:10px 25px;
border-radius:25px;
font-size:15px;
}
@media(max-width:800px){
.problem{
grid-template-columns:repeat(2,1fr);
}
}
@media(max-width:600px){
.nav{
gap:15px;
padding:0 10px;
}
.logo img{
height:50px;
width:50px;
}
.headline{
font-size:17px;
}
.nav a{
font-size:14px;
}
.help{
width:94%;
padding:20px 15px;
margin:25px auto;
}
.help h1{
font-size:27px;
}
.decor{
font-size:18px;
}
.help p{
font-size:14px;
}
.problem{
grid-template-columns:1fr;
gap:12px;
}
.problem button{
font-size:15px;
padding:18px 10px;
}
.options{
padding:18px 10px;
}
.options h2{
font-size:19px;
}
.option-list{
gap:8px;
}
.option-list button{
font-size:12px;
padding:8px 12px;
}
.answer{
padding:15px;
}
}
</style>
</head>
<body>
<div class="nav">
<div class="logo">
<img src="1stEmoji.jpeg">
</div>
<div class="headline">
<p>Go With The Trend !</p>
</div>
<a href="Offers.html">Offers</a>
<a href="Profile.html">About</a>
<a href="Help.html">Help</a>
</div>
<div class="help">
<h1>✨ Help & Support ✨</h1>
<div class="decor">♡ ─────── ♡ ─────── ♡</div>
<p>How can we help you?</p>
<div class="problem">
<button onclick="showOptions('order')">📦 Order Problem</button>
<button onclick="showOptions('payment')">💳 Payment Problem</button>
<button onclick="showOptions('product')">🛍️ Product Problem</button>
<button onclick="showOptions('delivery')">🚚 Delivery Problem</button>
<button onclick="showOptions('cancellation')">❌ Cancellation Problem</button>
<button onclick="showOptions('other')">❓ Other Problem</button>
</div>
<div class="options" id="options">
<h2 id="optionTitle">Select Your Problem</h2>
<div class="option-list" id="optionList"></div>
</div>
<div class="answer" id="answer">
<h2>💜 Solution</h2>
<p id="answerText"></p>
</div>
<a class="back" href="View.html">← Back To Home</a>
</div>
<script>
function showOptions(type){
let title=document.getElementById("optionTitle");
let list=document.getElementById("optionList");
let options="";
if(type==="order"){
title.innerHTML="📦 What is your order problem?";
options="<button onclick=\"showAnswer('order1')\">Order not received</button><button onclick=\"showAnswer('order2')\">Wrong product received</button><button onclick=\"showAnswer('order3')\">Want to return product</button>";
}
if(type==="payment"){
title.innerHTML="💳 What is your payment problem?";
options="<button onclick=\"showAnswer('payment1')\">Payment failed</button><button onclick=\"showAnswer('payment2')\">Money deducted</button><button onclick=\"showAnswer('payment3')\">Payment pending</button><button onclick=\"showAnswer('payment4')\">Want refund</button>";
}
if(type==="product"){
title.innerHTML="🛍️ What is your product problem?";
options="<button onclick=\"showAnswer('product1')\">Product damaged</button><button onclick=\"showAnswer('product2')\">Product different</button><button onclick=\"showAnswer('product3')\">Size problem</button><button onclick=\"showAnswer('product4')\">Product information</button>";
}
if(type==="delivery"){
title.innerHTML="🚚 What is your delivery problem?";
options="<button onclick=\"showAnswer('delivery1')\">Delivery is late</button><button onclick=\"showAnswer('delivery2')\">Wrong address</button><button onclick=\"showAnswer('delivery3')\">Track my order</button><button onclick=\"showAnswer('delivery4')\">Delivery cancelled</button>";
}
if(type==="cancellation"){
title.innerHTML="❌ What is your cancellation problem?";
options="<button onclick=\"showAnswer('cancel1')\">Cancel my order</button><button onclick=\"showAnswer('cancel2')\">Cancellation failed</button><button onclick=\"showAnswer('cancel3')\">Order already shipped</button><button onclick=\"showAnswer('cancel4')\">Refund after cancellation</button>";
}
if(type==="other"){
title.innerHTML="❓ Select your problem";
options="<button onclick=\"showAnswer('other1')\">Need more information</button><button onclick=\"showAnswer('other2')\">Website problem</button><button onclick=\"showAnswer('other3')\">Need customer support</button>";
}
list.innerHTML=options;
document.getElementById("options").style.display="block";
document.getElementById("answer").style.display="none";
}
function showAnswer(type){
let answer=document.getElementById("answerText");
if(type==="order1") answer.innerHTML="Please check your order status and expected delivery date. If your order is delayed, contact customer support.";
if(type==="order2") answer.innerHTML="If you received the wrong product, please contact customer support with your order details.";
if(type==="order3") answer.innerHTML="You can request a return according to the product's return policy.";
if(type==="payment1") answer.innerHTML="Please check your internet connection and payment details, then try the payment again.";
if(type==="payment2") answer.innerHTML="If money was deducted but the order was not confirmed, please check your payment status and contact support.";
if(type==="payment3") answer.innerHTML="Please wait for the payment status to update. If it remains pending, contact customer support.";
if(type==="payment4") answer.innerHTML="Refunds depend on the order and payment status. Please contact customer support for assistance.";
if(type==="product1") answer.innerHTML="If your product arrived damaged, please contact customer support for return or replacement assistance.";
if(type==="product2") answer.innerHTML="If you received a different product, please contact customer support with your order details.";
if(type==="product3") answer.innerHTML="Please check the available size information and return or exchange policy.";
if(type==="product4") answer.innerHTML="You can check the product description and details on the product category page.";
if(type==="delivery1") answer.innerHTML="Please check your order tracking information for the latest delivery status.";
if(type==="delivery2") answer.innerHTML="If the delivery address is incorrect, contact customer support as soon as possible.";
if(type==="delivery3") answer.innerHTML="Open your order details to check the current delivery status.";
if(type==="delivery4") answer.innerHTML="Please check your order details for the cancellation reason and contact support if needed.";
if(type==="cancel1") answer.innerHTML="You can cancel your order from the order details if the cancellation option is available.";
if(type==="cancel2") answer.innerHTML="If cancellation is not working, please check your order status and contact customer support.";
if(type==="cancel3") answer.innerHTML="Once an order has been shipped, cancellation may not be available. Please check the return policy.";
if(type==="cancel4") answer.innerHTML="If your order was successfully cancelled, the refund will depend on the payment method and order status.";
if(type==="other1") answer.innerHTML="Please select the category closest to your problem so that we can provide the appropriate information.";
if(type==="other2") answer.innerHTML="Try refreshing the webpage and checking your internet connection. If the problem continues, contact support.";
if(type==="other3") answer.innerHTML="Please provide your order details to customer support so they can help you.";
document.getElementById("answer").style.display="block";
}
</script>
</body>
</html>
```
