
<html>
<head>
<title>Add Your Product - Online Fashion Store Management System</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
*{
box-sizing:border-box;
}
body{
margin:0;
background-color:#e3d6f3;
font-family:Poppins,sans-serif;
}
.nav{
display:flex;
align-items:center;
gap:40px;
background-color:white;
min-height:60px;
width:100%;
padding:0 25px;
}
.logo img{
height:65px;
width:65px;
object-fit:cover;
border-radius:50%;
}
.headline{
color:#A64D79;
font-size:25px;
font-weight:bold;
}
.headline p{
margin:0;
}
.nav a:first-of-type{
margin-left:auto;
}
.nav a{
color:#872aa6;
text-decoration:none;
font-size:20px;
}
.nav a:hover{
color:#E8A0A8;
}
.form-box{
width:90%;
max-width:700px;
margin:35px auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 5px 20px rgba(93,45,120,0.2);
}
.form-box h1{
text-align:center;
color:#872aa6;
margin:5px 0;
}
.decor{
text-align:center;
color:#A64D79;
font-size:22px;
letter-spacing:4px;
margin-bottom:25px;
}
label{
display:block;
color:#872aa6;
font-weight:bold;
margin:15px 0 7px;
}
input,select,textarea{
width:100%;
padding:12px;
border:1px solid #d4b8df;
border-radius:8px;
font-family:Poppins,sans-serif;
font-size:14px;
outline:none;
}
textarea{
height:100px;
resize:none;
}
input:focus,select:focus,textarea:focus{
border-color:#872aa6;
}
#selectedImage{
display:none;
width:180px;
height:180px;
object-fit:cover;
margin:15px auto;
border-radius:10px;
}
.buttons{
text-align:center;
margin-top:25px;
}
button{
border:none;
padding:11px 25px;
border-radius:25px;
font-family:Poppins,sans-serif;
font-size:15px;
cursor:pointer;
color:white;
background:linear-gradient(135deg,#872aa6,#A64D79);
margin:5px;
}
button:hover{
transform:scale(1.04);
}
.message{
display:none;
text-align:center;
margin-top:20px;
padding:15px;
background:#f5eafa;
border-radius:10px;
color:#872aa6;
font-weight:bold;
}
@media(max-width:600px){
.nav{
gap:15px;
padding:0 10px;
}
.logo img{
height:50px;
width:50px;
}
.headline{
font-size:17px;
}
.nav a{
font-size:14px;
}
.form-box{
width:94%;
padding:20px 15px;
margin:25px auto;
}
.form-box h1{
font-size:27px;
}
}
</style>
</head>
<body>
<div class="nav">
<div class="logo">
<img src="1stEmoji.jpeg">
</div>
<div class="headline">
<p>Go With The Trend !</p>
</div>
<a href="Offers.html">Offers</a>
<a href="About.html">About</a>
<a href="Help.html">Help</a>
</div>
<div class="form-box">
<h1>✨ Add Your Product ✨</h1>
<div class="decor">♡ ─────── ♡</div>
<label>Product Name</label>
<input type="text" id="productName" placeholder="Enter product name">
<label>Category</label>
<select id="category">
<option value="">Select Category</option>
<option>Clothes</option>
<option>Makeup</option>
<option>Grocery</option>
<option>Footwear</option>
<option>Accessory</option>
<option>Stationary</option>
</select>
<label>Product Description</label>
<textarea id="description" placeholder="Enter product details"></textarea>
<label>Price</label>
<input type="number" id="price" placeholder="Enter product price">
<label>Your Name</label>
<input type="text" id="sellerName" placeholder="Enter your name">
<label>Contact Number</label>
<input type="tel" id="contact" placeholder="Enter contact number">
<label>Upload Product Image</label>
<input type="file" id="uploadImage" accept="image/*" onchange="uploadImage(this)">
<img id="selectedImage">
<div class="buttons">
<button onclick="saveProduct()">Save Product</button>
<button onclick="clearForm()">Clear</button>
</div>
<div class="message" id="message"></div>
</div>
<script>
let imagePath="";
function uploadImage(input){
if(input.files&&input.files[0]){
let reader=new FileReader();
reader.onload=function(e){
imagePath=e.target.result;
let selected=document.getElementById("selectedImage");
selected.src=imagePath;
selected.style.display="block";
};
reader.readAsDataURL(input.files[0]);
}
}
function saveProduct(){
let name=document.getElementById("productName").value;
let category=document.getElementById("category").value;
let description=document.getElementById("description").value;
let price=document.getElementById("price").value;
let seller=document.getElementById("sellerName").value;
let contact=document.getElementById("contact").value;
let message=document.getElementById("message");
if(name===""||category===""||description===""||price===""||seller===""||contact===""||imagePath===""){
message.innerHTML="Please fill all details and upload a product image.";
message.style.display="block";
return;
}
localStorage.setItem("productName",name);
localStorage.setItem("category",category);
localStorage.setItem("description",description);
localStorage.setItem("price",price);
localStorage.setItem("sellerName",seller);
localStorage.setItem("contact",contact);
localStorage.setItem("productImage",imagePath);
message.innerHTML="Product saved successfully! ✓";
message.style.display="block";
}
function clearForm(){
document.getElementById("productName").value="";
document.getElementById("category").value="";
document.getElementById("description").value="";
document.getElementById("price").value="";
document.getElementById("sellerName").value="";
document.getElementById("contact").value="";
document.getElementById("uploadImage").value="";
document.getElementById("selectedImage").style.display="none";
document.getElementById("message").style.display="none";
imagePath="";
}
</script>
</body>
</html>
